title = "rescue-bot"

[extend]
useDefault = true

[[rules]]
id = "tailscale-ip"
description = "IP de Tailscale (100.64.0.0/10) real; solo se permite 100.64.0.10 en ejemplos"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.\d{1,3}\.\d{1,3}\b'''
keywords = ["100."]
  [rules.allowlist]
  regexTarget = "match"
  regexes = ['''^100\.64\.0\.10$''']

[[rules]]
id = "tailscale-hostname"
description = "Hostname *.ts.net real; solo example.ts.net y el ficticio tailnet-xyz.ts.net de la spec"
regex = '''[a-z0-9][a-z0-9.-]*\.ts\.net\b'''
keywords = [".ts.net"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = ['''(^|\.)(example|tailnet-xyz)\.ts\.net$''']
