[project]
name = "rescue-bot"
version = "0.1.0"
description = "Rescate de apps desde Slack: diagnóstico de solo lectura y acciones con aprobación humana"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pyyaml>=6",
  "slack-bolt>=1.21",
]

[project.scripts]
rescue-approver = "rescue_bot.approver.server:main"
rescue-enroll = "rescue_bot.enroll:main"
rescue-add-app = "rescue_bot.add_app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rescue_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
